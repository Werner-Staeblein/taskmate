{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Taskmate - {% block title %}{% endblock title %}</title>

    <!-- Bootstrap 5.3.2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="{% static 'css/style.css' %}" rel="stylesheet">

    <link rel="icon" href="{% static 'images/favicon.ico' %}" type="imagex-icon" sizes="16x16">
    

  </head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark pt-3">
  <div class="container w-75 px-4">
    <!-- Logo -->
    <a class="navbar-brand" href="{% url 'index'%}">
      <img src="{% static 'images/logo.png' %}" alt="Taskmate">
    </a>

    <!-- Hamburger -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Collapsible Links -->
    <div class="collapse navbar-collapse w-100" id="navbarNavAltMarkup">
      <div class="navbar-nav">
        <a class="nav-link fw-bold text-white" href="{% url 'index'%}">Home</a>
        <a class="nav-link fw-bold text-white" href="{% url 'todolist'%}">Todo List</a>
        <a class="nav-link fw-bold text-white" href="{% url 'contact'%}">Contact Us</a>
        <a class="nav-link fw-bold text-white" href="{% url 'about'%}">About Us</a>
      </div>
    </div>
   
<!-- Auth Buttons -->
<div class="container-fluid mt-3 text-center">
  {% if user.is_authenticated %}
    <span class="text-white mb-2 d-block fs-6 fw-bold">Logged in als {{ user.email }}</span>
    <!-- Logout button: full-width on xs, inline on sm+ -->
    <a href="{% url 'logout' %}" class="btn btn-info w-100 mb-2 d-block d-sm-none">Logout</a>
    <a href="{% url 'logout' %}" class="btn btn-info mb-2 d-none d-sm-inline-block">Logout</a>
  {% else %}
    <div class="mx-auto" style="max-width: 320px;">
  <!-- Responsive Login buttons -->
  <a href="{% url 'login' %}" class="btn btn-success w-100 mb-2 d-block d-sm-none">Login</a>
  <a href="{% url 'login' %}" class="btn btn-success mb-2 me-2 d-none d-sm-inline-block">Login</a>

  <!-- Responsive Register buttons -->
  <a href="{% url 'registration' %}" class="btn btn-primary w-100 mb-2 d-block d-sm-none test-style">Register</a>
  <a href="{% url 'registration' %}" class="btn btn-primary mb-2 d-none d-sm-inline-block">Register</a>
</div>

  {% endif %}
</div>

</nav>

    {% block content %}
    <h1>{{welcome_text}}</h1>
    {% endblock content %}

    <!-- Bootstrap 5 JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
